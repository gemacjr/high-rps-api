# Local AWS: LocalStack (DynamoDB + SQS) + Valkey (Redis-compatible, same engine as ElastiCache in terraform).
# Host ports are shifted (4600, 6395, 8099) to avoid clashing with other local stacks.
#   docker compose up -d                  -> dependencies only, run the app with ./gradlew bootRun
#   docker compose --profile app up -d    -> dependencies + the containerised app
name: high-rps

services:
  localstack:
    image: localstack/localstack:4.14
    ports:
      - "4600:4566"
    environment:
      SERVICES: dynamodb,sqs
      # Only needed for newer LocalStack images; 4.14 runs these services without it.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6395:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    build: .
    ports:
      - "8099:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      PORT: "8080"
      AWS_ENDPOINT_URL: http://localstack:4566
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
